services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: v2ray-client
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - run
      - -config
      - /etc/xray/config.json
    volumes:
      - ./config.json:/etc/xray/config.json:ro
